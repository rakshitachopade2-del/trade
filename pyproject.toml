[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-research-demo"
version = "0.1.0"
description = "Local, synthetic-data trading research replay; no execution"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
trade-validate = "backend.app.validate:main"

[tool.setuptools.packages.find]
include = ["backend*"]
